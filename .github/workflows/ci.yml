name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # near-api-js 7.4.0 needs Node >= 22.22.2 (the root package.json engines floor).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (all workspaces + root scripts/e2e)
        run: npm run typecheck

      - name: Test (package units, e2e flows, dashboard, README and copy guards)
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Demo (full offline loop, must exit 0)
        run: npm run demo

  contracts:
    name: cargo test (unit + near-workspaces sandbox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # rustup installs the toolchain pinned in contracts/rust-toolchain.toml (1.95.0 + wasm32).
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # cargo-near's default `ledger` feature links hidapi, which needs libudev and pkg-config.
      # Keeping the default features builds the same cargo-near that built and tested the wasm locally.
      - name: Install cargo-near's system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install cargo-near
        run: cargo install --locked cargo-near --version 0.22.0

      # The sandbox tests deploy this wasm; they fail with a message naming this command without it.
      - name: Build the contract wasm
        working-directory: contracts/registry
        run: cargo near build non-reproducible-wasm

      - name: Test (unit + sandbox)
        run: cargo test
