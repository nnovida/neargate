name: images

# Publishes the two images Railway runs, the gateway and the dashboard, to the GitHub Container
# Registry when a release is published (or by hand from the Actions tab). They are listed under the
# repository's Packages as ghcr.io/<owner>/neargate-gateway and ghcr.io/<owner>/neargate-dashboard,
# tagged with the release version (v0.2.1 -> 0.2.1), latest and the commit.
# The job signs in with the workflow's own GITHUB_TOKEN; no other secret is used.

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: neargate-gateway
            dockerfile: packages/middleware/Dockerfile
            description: NearGate gateway, the HTTP 402 (x402) paywall that settles API calls in native NEAR
          - image: neargate-dashboard
            dockerfile: dashboard/Dockerfile
            description: NearGate dashboard, the on-chain registry's catalog, scores and docs
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source (set by default to this repository) links each image to it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      # Both Dockerfiles build from the repository root. The dashboard image is generic: its site
      # origin (NEXT_PUBLIC_SITE_URL) stays unset; the repository link points here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_REPO_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
