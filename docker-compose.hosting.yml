# Hosted NearGate stack: the live x402 gateway and the read-only dashboard, both against NEAR
# (testnet unless NEAR_NETWORK says otherwise). The offline mock stack is `npm run dev`, not this file.
#
#   cp .env.example .env     # then fill in REGISTRY_CONTRACT_ID, GATEWAY_ACCOUNT_ID and a strong
#                            # AGENTGATE_ADMIN_TOKEN (compose refuses to start without them)
#   docker compose -f docker-compose.hosting.yml up -d --build
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3012/svc/1   # 402: the paywall answers
#   curl -sS http://127.0.0.1:3011/api/health                              # {"status":"ok"}
#
# Compose reads the root .env only to fill in the ${...} values below. There is no env_file, so
# nothing else in that file reaches a container: the dashboard never sees the admin token or a key.
#
# The gateway's signing key is NOT in this file, in an image or in .env. The gateway finds it the
# way it does outside docker: ~/.near-credentials/<network>/<GATEWAY_ACCOUNT_ID>.json, written by
# `npm run near:bootstrap` or the near CLI, mounted read-only from the host's home directory below.
# The file must be readable by uid 1000 (the image's `node` user).
#
# Both ports are published on 127.0.0.1 only: put cloudflared or a reverse proxy in front for public
# traffic (TRUST_PROXY=1 below assumes exactly one such hop). Stop and wipe the gateway's state:
#   docker compose -f docker-compose.hosting.yml down -v

services:
  neargate-gateway:
    build:
      context: .
      dockerfile: packages/middleware/Dockerfile
    image: neargate-gateway
    environment:
      AGENTGATE_MODE: live
      # The image maps PORT onto the gateway's own port setting, and its healthcheck follows it.
      PORT: '3012'
      # One reverse-proxy hop in front. Never raise it above the real hop count.
      TRUST_PROXY: '1'
      NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      NEAR_EXPLORER_URL: ${NEAR_EXPLORER_URL:-}
      REGISTRY_CONTRACT_ID: ${REGISTRY_CONTRACT_ID:?set REGISTRY_CONTRACT_ID in .env}
      GATEWAY_ACCOUNT_ID: ${GATEWAY_ACCOUNT_ID:?set GATEWAY_ACCOUNT_ID in .env}
      AGENTGATE_ADMIN_TOKEN: ${AGENTGATE_ADMIN_TOKEN:?set a strong AGENTGATE_ADMIN_TOKEN in .env}
      # Issued invoices and pending attestations survive a restart (the volume below).
      INVOICE_STORE_PATH: /app/packages/middleware/data/gateway-invoices.json
      ATTESTATION_QUEUE_PATH: /app/packages/middleware/data/gateway-attestations.json
    ports:
      - '127.0.0.1:3012:3012'
    volumes:
      - ${HOME}/.near-credentials:/home/node/.near-credentials:ro
      - gateway-data:/app/packages/middleware/data
    # Exactly ONE gateway replica: receipts and rate limits are per-process memory, so a second
    # replica would split them.
    deploy:
      replicas: 1
    restart: unless-stopped

  neargate-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at build time: set the origin the dashboard is served from
        # (https://<dashboard-host>) before building, or leave it empty for the built-in default.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        # Optional: the GitHub links show only when this is set.
        NEXT_PUBLIC_REPO_URL: ${NEXT_PUBLIC_REPO_URL:-}
    image: neargate-dashboard
    environment:
      AGENTGATE_MODE: live
      PORT: '3011'
      NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      NEAR_EXPLORER_URL: ${NEAR_EXPLORER_URL:-}
      REGISTRY_CONTRACT_ID: ${REGISTRY_CONTRACT_ID:?set REGISTRY_CONTRACT_ID in .env}
    ports:
      - '127.0.0.1:3011:3011'
    restart: unless-stopped

volumes:
  gateway-data:
